# coturn — TURN relay for agent softphones (S171).
#
# FreeSWITCH (in Docker) can only offer browsers its Docker address (172.19.0.7), which only the
# Docker host PC can reach. A softphone that can't reach it directly relays its audio through this
# server, which sits on the same Docker network and forwards to FreeSWITCH.
#
# Browsers reach it on port 3478 only (published by docker-compose): LAN agents at this PC's LAN
# address, remote agents at the public IP. Relay ports stay inside Docker. Dev host requirements:
#   - router: forward 3478 TCP+UDP (and RTP 16384-16393 UDP) to this PC's reserved LAN IP;
#   - Windows Firewall: Docker Desktop's own allow rules only cover the *Public* profile, so on a
#     Private network inbound 3478 is dropped — add "ContactConnection TURN (UDP/TCP 3478)" and
#     "ContactConnection RTP (UDP 16384-16393)" inbound allow rules for the Private profile.
#
# Credentials: TURN REST API scheme (use-auth-secret). The API issues short-lived
# username/password pairs to signed-in agents; the shared secret comes from .env
# (TURN_STATIC_AUTH_SECRET) via the container command line — never stored in this file.

listening-port=3478
fingerprint
use-auth-secret
realm=contactconnection.io

min-port=49160
max-port=49199

# Only ever relay to FreeSWITCH's Docker network — never an open relay to the internet or the LAN.
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=172.19.0.0-172.19.255.255
no-multicast-peers

no-cli
no-tls
no-dtls
log-file=stdout
simple-log
