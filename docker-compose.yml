services:

  postgres:
    image: postgres:16
    container_name: cc_postgres
    environment:
      POSTGRES_USER: hubion
      POSTGRES_PASSWORD: hubion_dev
      POSTGRES_DB: hubion_master
    ports:
      - "5432:5432"
    volumes:
      - cc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubion -d hubion_master"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    ports:
      - "6379:6379"
    volumes:
      - cc_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keeps the shared Docker Desktop / WSL2 VM kernel clock disciplined. That one
  # kernel clock is shared by every container, so this single sidecar fixes time
  # drift for all of them (FreeSWITCH especially — recording + screen-capture
  # timestamp alignment depends on it). WSL2's own resync is unreliable after a
  # long host sleep/hibernate (Session 98: SIP reg EXP was ~2 days stale).
  # Needs SYS_TIME to step the kernel clock; nothing else.
  timesync:
    build:
      context: ./timesync
    container_name: cc_timesync
    restart: unless-stopped
    cap_add:
      - SYS_TIME

  freeswitch:
    build:
      context: ./freeswitch
      args:
        SIGNALWIRE_PAT: ${SIGNALWIRE_PAT}
    container_name: cc_freeswitch
    depends_on:
      - timesync
    ports:
      - "5060:5060/udp"              # SIP — internal profile (agent softphones)
      - "5060:5060/tcp"              # SIP TCP
      - "5080:5080/udp"              # SIP — external profile (SIP trunk)
      - "5080:5080/tcp"              # SIP TCP
      - "7080:7080/tcp"              # WS  — WebRTC softphone, plain (local dev)
      - "7443:7443/tcp"              # WSS — WebRTC softphone, TLS (production)
      - "127.0.0.1:8021:8021/tcp"    # ESL — .NET Worker connects here (loopback only, never public)
      - "16384-16393:16384-16393/udp" # RTP media (matches switch.conf.xml + router port-forwards)
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./freeswitch/sounds:/usr/share/freeswitch/sounds/contactconnection
      # Call recordings written by uuid_record. Host-mounted so the (future) transcode/upload
      # worker can read the .wav files; contents are gitignored (runtime data, not source).
      - ./freeswitch/recordings:/var/lib/freeswitch/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: cc_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgadmin:
    image: dpage/pgadmin4
    container_name: cc_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@contactconnection.local
      PGADMIN_DEFAULT_PASSWORD: cc_dev
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cc_pgadmin:/var/lib/pgadmin

  mailhog:
    image: mailhog/mailhog
    container_name: cc_mailhog
    ports:
      - "1025:1025"    # SMTP — configure outbound email to localhost:1025
      - "8025:8025"    # Web UI — http://localhost:8025

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cc_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - freeswitch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published routes (Cloudflare Zero Trust dashboard) all target host.docker.internal.
    # Same tunnel serves both domains during the .cc -> .io migration:
    #   softphone.contactconnection.{cc,io} -> host.docker.internal:7080 (FreeSWITCH WS, host-published)
    #   *.contactconnection.{cc,io}         -> host.docker.internal:5173 (Vite dev server, `npm run dev`)
    # nginx (port 80) is not currently in any route's path.
    # --protocol http2: default QUIC (UDP) transport was dropping all 4 edge connections
    # simultaneously every ~90 min (`timeout: no recent network activity`, all connIndex 0-3 at
    # once) on this Windows/Docker Desktop/WSL2 host, surfacing to the browser as
    # ERR_SSL_PROTOCOL_ERROR for ~5-30s per drop until cloudflared reconnected. Diagnosed Session
    # 88 (2026-08-25) from `docker logs cc_cloudflared`. HTTP/2 (TCP) transport handles idle/NAT
    # timeouts far more gracefully than QUIC on this kind of host networking setup.

volumes:
  cc_pgdata:
  cc_redisdata:
  cc_pgadmin:
