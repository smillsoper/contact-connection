# chrony config for the cc_timesync sidecar.
#
# Purpose: keep the Docker Desktop / WSL2 utility-VM kernel clock disciplined.
# All containers share that one kernel clock, so correcting it here fixes time
# for every container (FreeSWITCH included) without rebuilding any image.
#
# The WSL2 VM clock drifts when the Windows host sleeps/hibernates and its
# built-in resync is unreliable for long suspends (Session 98: FreeSWITCH SIP
# registration EXP was ~2 days stale, breaking recording/screen-capture
# timestamp alignment). chrony with an aggressive makestep snaps it back.

pool pool.ntp.org iburst

# Step the clock (rather than slew) whenever the offset exceeds 1s, with no
# limit on how many times -- this is what recovers the large jump after a host
# resume. Slewing would take hours to correct a multi-day drift.
makestep 1.0 -1

# Sync the RTC from system time when well-disciplined (harmless in a VM).
rtcsync

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# chronyd runs as PID 1 in this container under Docker's own restart
# supervision -- the stale pidfile from a prior failed start survives in the
# writable layer across restarts, and since PID 1 is always alive, chronyd
# reads it back, assumes another instance owns that PID, and refuses to
# start -- a permanent crash loop that never gets a chance to self-correct.
# Disabling the pidfile removes the check entirely; nothing else in this
# sidecar depends on it (no init script sends it signals).
pidfile ''

# Record clock-tracking history so a correction after a real host resume is
# visible later (docker exec cc_timesync cat /var/log/chrony/tracking.log).
log tracking
